<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#f1f2f4"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c2127"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1c2127" stroke-width="1"/>
    </pattern>
  </defs>
  <g fill="none" stroke="#1c2127" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- wall / actuator base -->
    <rect x="60" y="180" width="14" height="140" fill="url(#hatch)"/>
    <!-- actuator -->
    <rect x="74" y="215" width="90" height="70"/>
    <circle cx="119" cy="250" r="18"/>
    <line x1="119" y1="232" x2="119" y2="268"/>
    <!-- string: a wave -->
    <path d="M164 250 C 230 200, 290 300, 360 250 S 490 200, 560 250"/>
    <path d="M164 250 L560 250" stroke="#7b8794" stroke-dasharray="4 5" stroke-width="1"/>
    <!-- load -->
    <rect x="560" y="215" width="90" height="70"/>
    <circle cx="580" cy="292" r="7"/>
    <circle cx="630" cy="292" r="7"/>
    <line x1="500" y1="300" x2="720" y2="300"/>
    <!-- control input arrow -->
    <line x1="119" y1="150" x2="119" y2="196" marker-end="url(#a)"/>
    <!-- displacement of load -->
    <line x1="605" y1="180" x2="680" y2="180" marker-end="url(#a)"/>
    <!-- x axis -->
    <line x1="164" y1="360" x2="560" y2="360" marker-end="url(#a)"/>
    <line x1="164" y1="352" x2="164" y2="368"/>
    <line x1="560" y1="352" x2="560" y2="368"/>
  </g>
  <g fill="#1c2127">
    <text x="80" y="140">u(t) — boundary input</text>
    <text x="80" y="310" fill="#4b5563" font-size="12">actuator</text>
    <text x="300" y="215" fill="#4b5563">w(x,t): wave equation</text>
    <text x="572" y="255">load, m</text>
    <text x="600" y="170" fill="#4b5563">z(t)</text>
    <text x="158" y="385">0</text>
    <text x="552" y="385">L</text>
    <text x="340" y="385" fill="#4b5563">x</text>
    <text x="60" y="60" font-size="15" font-weight="600">String-actuated system</text>
    <text x="60" y="84" fill="#4b5563">PDE (string) coupled with the ODE of the load — boundary control after Wang and Krstic</text>
    <text x="60" y="470" fill="#7b8794" font-size="12">Goal: position the load and damp the string oscillations acting only at x = 0</text>
  </g>
</svg>
