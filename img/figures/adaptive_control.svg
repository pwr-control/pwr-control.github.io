<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#f1f2f4"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c2127"/>
    </marker>
  </defs>
  <g fill="none" stroke="#1c2127" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- reference model -->
    <rect x="250" y="120" width="160" height="60"/>
    <!-- controller -->
    <rect x="250" y="250" width="160" height="60"/>
    <!-- plant -->
    <rect x="470" y="250" width="140" height="60"/>
    <!-- adaptation law -->
    <rect x="250" y="370" width="160" height="60"/>
    <!-- summing junction -->
    <circle cx="680" cy="215" r="12"/>
    <line x1="674" y1="215" x2="686" y2="215"/>
    <line x1="680" y1="209" x2="680" y2="221"/>
    <!-- r input -->
    <line x1="60" y1="280" x2="250" y2="280" marker-end="url(#a)"/>
    <line x1="150" y1="280" x2="150" y2="150"/>
    <line x1="150" y1="150" x2="250" y2="150" marker-end="url(#a)"/>
    <circle cx="150" cy="280" r="3" fill="#1c2127"/>
    <!-- controller -> plant -->
    <line x1="410" y1="280" x2="470" y2="280" marker-end="url(#a)"/>
    <!-- plant output y -->
    <line x1="610" y1="280" x2="740" y2="280" marker-end="url(#a)"/>
    <line x1="680" y1="280" x2="680" y2="227" marker-end="url(#a)"/>
    <circle cx="680" cy="280" r="3" fill="#1c2127"/>
    <!-- ref model output ym -->
    <line x1="410" y1="150" x2="680" y2="150"/>
    <line x1="680" y1="150" x2="680" y2="203" marker-end="url(#a)"/>
    <!-- error e -> adaptation -->
    <line x1="692" y1="215" x2="720" y2="215"/>
    <line x1="720" y1="215" x2="720" y2="400"/>
    <line x1="720" y1="400" x2="410" y2="400" marker-end="url(#a)"/>
    <!-- adaptation -> controller (dashed) -->
    <line x1="330" y1="370" x2="330" y2="310" marker-end="url(#a)" stroke-dasharray="4 4"/>
    <!-- y feedback to controller -->
    <line x1="640" y1="280" x2="640" y2="340" />
    <line x1="640" y1="340" x2="220" y2="340" />
    <line x1="220" y1="340" x2="220" y2="295" />
    <line x1="220" y1="295" x2="250" y2="295" marker-end="url(#a)"/>
    <circle cx="640" cy="280" r="3" fill="#1c2127"/>
  </g>
  <g fill="#1c2127">
    <text x="262" y="155">reference model</text>
    <text x="262" y="285">controller θ</text>
    <text x="482" y="285">plant</text>
    <text x="262" y="405">adaptation law</text>
    <text x="60" y="270">r</text>
    <text x="430" y="140" fill="#4b5563">y_m</text>
    <text x="700" y="270" fill="#4b5563">y</text>
    <text x="730" y="330" fill="#4b5563">e = y − y_m</text>
    <text x="664" y="200" fill="#4b5563" font-size="11">−</text>
    <text x="690" y="300" fill="#4b5563" font-size="11">+</text>
    <text x="60" y="60" font-size="15" font-weight="600">Model-reference adaptive control</text>
    <text x="60" y="84" fill="#4b5563">active suspension with speed-bump disturbance · double-integrator textbook case</text>
    <text x="60" y="470" fill="#7b8794" font-size="12">Also in the repository: harmonic-tracker observers (50 / 400 Hz) and a coupled PDE/ODE thermal model</text>
  </g>
</svg>
