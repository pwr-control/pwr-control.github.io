<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#f1f2f4"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c2127"/>
    </marker>
  </defs>
  <g fill="none" stroke="#1c2127" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- controller -->
    <rect x="60" y="180" width="150" height="70"/>
    <!-- modulator -->
    <rect x="250" y="180" width="110" height="70"/>
    <!-- inverter -->
    <rect x="400" y="170" width="90" height="90"/>
    <line x1="400" y1="260" x2="490" y2="170"/>
    <line x1="418" y1="192" x2="440" y2="192"/>
    <line x1="420" y1="200" x2="438" y2="200"/>
    <path d="M452 240 q6 -12 12 0 t12 0"/>
    <!-- machine -->
    <circle cx="600" cy="215" r="42"/>
    <!-- signal flow -->
    <line x1="210" y1="215" x2="250" y2="215" marker-end="url(#a)"/>
    <line x1="360" y1="215" x2="400" y2="215" marker-end="url(#a)"/>
    <line x1="490" y1="205" x2="558" y2="205"/>
    <line x1="490" y1="215" x2="558" y2="215"/>
    <line x1="490" y1="225" x2="558" y2="225"/>
    <!-- observer -->
    <rect x="330" y="340" width="220" height="70"/>
    <line x1="520" y1="260" x2="520" y2="340" marker-end="url(#a)" stroke-dasharray="4 4"/>
    <line x1="330" y1="375" x2="135" y2="375" stroke-dasharray="4 4"/>
    <line x1="135" y1="375" x2="135" y2="250" marker-end="url(#a)" stroke-dasharray="4 4"/>
    <!-- reference in -->
    <line x1="20" y1="215" x2="60" y2="215" marker-end="url(#a)"/>
    <!-- DC bus -->
    <line x1="445" y1="120" x2="445" y2="170"/>
    <line x1="425" y1="120" x2="465" y2="120"/>
  </g>
  <g fill="#1c2127">
    <text x="72" y="208">current control</text>
    <text x="72" y="228" fill="#4b5563">dq PI  |  MPC</text>
    <text x="262" y="208">modulator</text>
    <text x="262" y="228" fill="#4b5563">SVPWM</text>
    <text x="580" y="220" font-size="15">PMSM</text>
    <text x="342" y="368">position / speed observer</text>
    <text x="342" y="390" fill="#4b5563">back-EMF  |  EKF  |  nonlinear</text>
    <text x="20" y="200">i*</text>
    <text x="498" y="196" fill="#4b5563" font-size="12">i, u</text>
    <text x="150" y="330" fill="#4b5563">θ̂, ω̂</text>
    <text x="425" y="110" fill="#4b5563" font-size="12">DC link</text>
    <text x="60" y="60" font-size="15" font-weight="600">Sensorless PMSM control — five benches on one plant</text>
    <text x="60" y="84" fill="#4b5563">2 modulator / controller choices × 3 observers, same machine and inverter model</text>
    <text x="60" y="470" fill="#7b8794" font-size="12">Simscape machine and device models · control code in C through C-Caller blocks</text>
  </g>
</svg>
