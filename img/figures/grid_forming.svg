<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="500" fill="#f1f2f4"/>
  <g fill="none" stroke="#1c2127" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- DC link: capacitor between the rails -->
    <line x1="60" y1="215" x2="150" y2="215"/>
    <line x1="60" y1="285" x2="150" y2="285"/>
    <line x1="100" y1="215" x2="100" y2="244"/>
    <line x1="100" y1="256" x2="100" y2="285"/>
    <line x1="86" y1="244" x2="114" y2="244"/>
    <line x1="86" y1="256" x2="114" y2="256"/>
    <!-- AFE module 1 -->
    <rect x="150" y="190" width="120" height="120"/>
    <line x1="150" y1="310" x2="270" y2="190"/>
    <line x1="175" y1="215" x2="205" y2="215"/>
    <line x1="177" y1="225" x2="203" y2="225"/>
    <path d="M225 285 q7 -14 14 0 t14 0"/>
    <!-- AFE module 2 (dashed, optional) -->
    <g stroke-dasharray="5 5" stroke="#7b8794">
      <rect x="150" y="330" width="120" height="100"/>
      <line x1="150" y1="430" x2="270" y2="330"/>
      <line x1="100" y1="285" x2="100" y2="410"/>
      <line x1="100" y1="350" x2="150" y2="350"/>
      <line x1="100" y1="410" x2="150" y2="410"/>
      <line x1="270" y1="380" x2="340" y2="380"/>
      <line x1="340" y1="380" x2="340" y2="250"/>
    </g>
    <!-- filter inductor -->
    <line x1="270" y1="250" x2="300" y2="250"/>
    <path d="M300 250 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0"/>
    <line x1="364" y1="250" x2="410" y2="250"/>
    <!-- transformer Dyn11 -->
    <circle cx="440" cy="250" r="30"/>
    <circle cx="480" cy="250" r="30"/>
    <line x1="510" y1="250" x2="560" y2="250"/>
    <!-- grid emulator: source + impedance -->
    <rect x="560" y="236" width="50" height="28"/>
    <line x1="610" y1="250" x2="650" y2="250"/>
    <circle cx="675" cy="250" r="25"/>
    <path d="M660 250 q7.5 -12 15 0 t15 0"/>
    <line x1="700" y1="250" x2="730" y2="250"/>
    <line x1="730" y1="230" x2="730" y2="270"/>
    <line x1="738" y1="238" x2="738" y2="262"/>
    <line x1="746" y1="245" x2="746" y2="255"/>
    <!-- measurement arrows -->
    <line x1="385" y1="250" x2="385" y2="150" stroke-dasharray="3 4"/>
    <line x1="530" y1="250" x2="530" y2="150" stroke-dasharray="3 4"/>
  </g>
  <g fill="#1c2127">
    <text x="60" y="180">DC link</text>
    <text x="150" y="178">AFE 250 kW</text>
    <text x="150" y="322" fill="#7b8794">module n (up to 4)</text>
    <text x="296" y="232">L</text>
    <text x="430" y="300">Dyn11</text>
    <text x="558" y="226">Z grid</text>
    <text x="600" y="300">grid emulator 1.25 MVA</text>
    <text x="600" y="318">690 V / 50 Hz</text>
    <text x="360" y="140">i, u line</text>
    <text x="505" y="140">u grid</text>
    <text x="60" y="60" font-size="15" font-weight="600">Active front end on a weak grid</text>
    <text x="60" y="84" fill="#4b5563">short-circuit ratio 20 · 6 · 4 · 3 · 2 — FRT dip at 0.75 s, reactive-current steps</text>
    <text x="60" y="470" fill="#7b8794" font-size="12">DC-link PI → resonant PI current control · FHT dq-PLL · SOGI · sequence separation</text>
  </g>
</svg>
